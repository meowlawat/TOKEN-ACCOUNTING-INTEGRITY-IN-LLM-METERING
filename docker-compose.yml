# Phase 0 skeleton: FastAPI gateway + PostgreSQL (credits/quota) + Redis (cache-dodging class).
# `docker compose up --build` yields a running, vulnerable-by-construction LLM-SaaS testbed.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: metering
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering -d metering"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Async SQLAlchemy URL (note the +asyncpg driver).
      DATABASE_URL: postgresql+asyncpg://metering:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/metering
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      # Default flaw-class posture. Flip per-class at runtime via POST /admin/config.
      CLASS6_CREDIT_RACE: ${CLASS6_CREDIT_RACE:-hardened}
      # Pre-populated tokenizer caches (mounted below) so the container never needs
      # network access to run the real-tokenizer recount benchmark.
      TIKTOKEN_CACHE_DIR: /tokcache/tiktoken
      HF_HOME: /tokcache/hf
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # Optional third-party serving stack (llama.cpp llama-server) on the host, used
      # only by requests that ask for generator="real". Unset/unreachable is fine: the
      # default mock generator does not touch it.
      REAL_LLM_URL: ${REAL_LLM_URL:-http://host.docker.internal:8899}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./tokenizer_cache:/tokcache:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
