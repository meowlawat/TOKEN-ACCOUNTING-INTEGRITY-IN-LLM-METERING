# PHASE 1 topology: reverse proxy -> 4 gateway workers -> shared PostgreSQL + Redis.
#
# Purpose: determine whether the accounting-security results depend on running inside a
# single event loop. The single-worker `docker-compose.yml` remains the CONTROL.
#
#   docker compose -f docker-compose.multiworker.yml up --build -d
#   (gateway on :8001 so it can run alongside the single-worker control on :8000)
#
# NOTE: the B0 runtime posture lives in Redis (shared) precisely because a per-process
# posture would only reach one of the four workers.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: metering
    volumes:
      - pgdata_mw:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering -d metering"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql+asyncpg://metering:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/metering
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      CLASS6_CREDIT_RACE: ${CLASS6_CREDIT_RACE:-hardened}
      TIKTOKEN_CACHE_DIR: /tokcache/tiktoken
      HF_HOME: /tokcache/hf
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      GATEWAY_NAME: mw
    volumes:
      - ./tokenizer_cache:/tokcache:ro
    # FOUR worker processes behind uvicorn's supervisor: four independent event loops
    # sharing one PostgreSQL and one Redis.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  proxy:
    image: nginx:1.27-alpine
    depends_on: [app]
    ports:
      - "127.0.0.1:8001:80"
    volumes:
      - ./deploy/nginx.multiworker.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata_mw:
