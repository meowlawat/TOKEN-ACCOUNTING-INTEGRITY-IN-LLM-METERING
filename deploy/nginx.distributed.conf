# Load balancer across two independent gateway instances (Phase 2 topology).
# Round-robin by default so consecutive requests from one client land on DIFFERENT
# instances -- exactly the condition that would break any locality assumption in the
# accounting path.
upstream gateways {
    server gateway_a:8000;
    server gateway_b:8000;
}

server {
    listen 80;
    client_max_body_size 32m;

    location / {
        proxy_pass http://gateways;
        proxy_http_version 1.1;

        # Streaming must pass through unbuffered so M1 abort timing reflects the
        # gateway's delivery, not the proxy's buffer.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
