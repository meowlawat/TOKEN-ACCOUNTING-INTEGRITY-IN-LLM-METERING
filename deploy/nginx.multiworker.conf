# Reverse proxy in front of the 4-worker gateway (Phase 1 topology).
# Streaming must not be buffered, or M1 abort timing would be measured against nginx's
# buffer rather than against the gateway's actual delivery.
upstream gateway {
    server app:8000;
}

server {
    listen 80;
    client_max_body_size 32m;

    location / {
        proxy_pass http://gateway;
        proxy_http_version 1.1;

        # Critical for M1: deliver SSE tokens immediately and propagate client aborts.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
